# Maid Curios Manager - 女仆饰品管理 默认配置
# 实际生效的配置文件在游戏运行后生成于 config/maidcuriosmanager-common.toml，
# 此处内容为项目内的打包样例，随模组 JAR 一起分发。
#
# 注意：Forge 不会因为默认值改变而覆盖你已有的配置文件。
# 若你从旧版本升级，且 maxSlotsPerType 仍是 8，请手动改为 64，
# 或删除本文件让它按新默认值重新生成。

[general]
    # 本模组的总开关。关闭后：快捷键不响应、女仆界面上的入口也会隐藏。
    # 此项只控制本模组，不影响车万女仆自带的 enable_maid_curios（那才是真正启用女仆饰品栏的开关）。
    enableManager = true
    # 【已停用】潜行右键女仆的入口已移除，本项不再有任何作用，保留仅为兼容旧配置文件。
    requireSneak = true
    # 每类饰品槽位通过本模组最多可扩充到的槽位数（默认与事实上限 64 一致）
    maxSlotsPerType = 64
    # 单个饰品槽位可通过本模组设置的堆叠数量上限
    maxStackCount = 64
